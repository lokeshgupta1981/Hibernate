spring.application.name=wine-catalog

# H2 in-memory database, filled by data.sql
spring.datasource.url=jdbc:h2:mem:wines
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Hibernate Search: Lucene backend, index stored on disk
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.backend.directory.root=data/wine-index
spring.jpa.properties.hibernate.search.backend.lucene_version=LATEST
spring.jpa.properties.hibernate.search.backend.analysis.configurer=bean:wineAnalysisConfigurer

# Rebuild the index from the database when the application is ready
wine.search.reindex-on-startup=true
